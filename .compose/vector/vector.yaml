data_dir: /var/lib/vector

enrichment_tables:
  otela_geoip:
    type: geoip
    path: /var/lib/geoip/GeoLite2-City.mmdb

sources:
  host_metrics:
    type: host_metrics
    scrape_interval_secs: 30

#  baywatch_prometheus:
#    type: prometheus_scrape
#    endpoints:
#      - http://baywatch:8081/actuator/prometheus
#    scrape_interval_secs: 5
#    auth:
#      strategy: basic
#      user: "{{ _otel_baywatch_user }}"
#      password: "{{ _otel_baywatch_password }}"

  docker_logs:
    type: docker_logs
    include_containers:
      - otela-nginx

transforms:

  docker_logs_processed:
    type: remap
    inputs:
      - docker_logs
    source: |
      .container.id = del(.container_id)
      .container.image = del(.image)
      .container.name = del(.container_name)

      if (match(string!(.container.image), r'^.*baywatch.*$')) {
        .service.name = "baywatch"
        app, app_err = parse_json(.message)
        if app_err == null {
          .timestamp = app.timestamp
          .level = downcase(string(app.level) ?? "")
          .message = string(app.message) ?? .message
        }

      } else if (match(string!(.container.image), r'^.*imgproxy.*$')) {
        .service.name = "imgproxy"
        app, app_err = parse_json(.message)
        if app_err == null {
          .timestamp = app.time
          .level = downcase(string(app.level) ?? "")
          if app.error != null {
            .message = string(app.error) ?? .message
          } else if app.msg != null {
            .message = string(app.msg) ?? .message
          }
          if app.request_id != null {
            .thread = app.request_id
          }
        }
      
      } else if (match(string!(.container.image), r'^.*nginx.*$')) {
        .service.name = "nginx"
        parsed_main, err = parse_nginx_log(.message, "main")
        if (err == null) {
          . = merge(., parsed_main)
          .message = .request
      
          status = to_int(.status)
          if status >= 500 {
            .level = "error"
          } else if status >= 400 {
            .level = "warn"
          } else if status >= 200 {
            .level = "info"
          } else {
            .level = "debug"
          }
      
        } else {
          parsed_combined, err = parse_nginx_log(.message, "combined")
          if (err == null) {
            . = merge(., parsed_combined)
          } else {
            parsed_error, err = parse_nginx_log(.message, "error")
            if (err == null) {
              . = merge(., parsed_error)
            } else {
              log(err, level: "error")
            }
          }
        }
      }
  
      if exists(.severity) { .level = del(.severity) }
      if exists(.level) { .level = downcase!(.level) } else {.level = "info"}
      del(.attrs); del(.stream); del(.time); del(.label)

  nginx_otela_lines:
    type: filter
    inputs:
      - docker_logs_processed
    condition: contains(string!(.request), "POST /otela")

  nginx_otela_parsed:
    type: remap
    inputs:
      - nginx_otela_lines
    source: |
      req = string(.request) ?? ""
      req_parts = split(req, " ")
      if length(req_parts) < 2 {
        abort
      }
      
      .path = string!(req_parts[1])
      if !starts_with(.path, "/otela") {
        abort
      }

      path_parts = split_path(.path)
      if length(path_parts) < 2 {
        abort
      }
      payload_url = path_parts[-1]
      payload_json_raw, payload_err = decode_base64(payload_url)
      if payload_err != null {
        abort
      }

      payload_json, parse_payload_err = parse_json(string(payload_json_raw))
      if parse_payload_err != null {
        abort
      }

      .job = "otela"
      
      .ip = "127.0.0.1"
      if exists(.remote_addr) { .ip = del(.remote_addr) }
      if exists(.http_x_forwarded_for) { .ip = del(.http_x_forwarded_for) }
      
      ua_raw = string(.http_user_agent) ?? ""
      .navigator = ""
      .os = ""
      .platform = "desktop"

      ua = parse_user_agent(ua_raw)
      .navigator = string(ua.browser.family) ?? ""
      .os = string(ua.os.family) ?? ""
      ua_device = downcase(string(ua.device.category) ?? "")
      if ua_device == "mobile" || ua_device == "tablet" || ua_device == "wearable" || ua_device == "smarttv" {
        .platform = "mobile"
      } else if ua_device == "pc" || ua_device == "desktop" {
        .platform = "desktop"
      }

      if .navigator == "" {
        .navigator = ua_raw
      }

      .service.name = ""
      .span.name = "/"
      http_referer = string!(.http_referer)
      if http_referer != "-" && http_referer != "" {
        parsed_service, parsed_service_err = parse_url(http_referer)
        if parsed_service_err == null && parsed_service.host != null {
          .service.name = string(parsed_service.host) ?? ""
        }
        if parsed_service_err == null && parsed_service.path != null {
          .span.name = string(parsed_service.path) ?? ""
        }
      }
      if .service.name == "" && .referer != "direct" {
        .service.name = .referer
      }
      if .service.name == "" {
        abort
      }
      
      .referer = string(payload_json.referer) ?? "direct"
      if .referer == "" {
        .referer = "direct"
      }
      if starts_with(.referer, "http://") || starts_with(.referer, "https://") {
        parsed_referer, parsed_referer_err = parse_url(.referer)
        if parsed_referer_err == null && parsed_referer.host != null {
          .referer = string(parsed_referer.host) ?? .referer
        }
      }

      .span.title = string(payload_json.title) ?? "-"
      .metric_increment = 1
      del(.body_bytes_size)
      del(.http_referer)
      del(.http_user_agent)
      del(.http_x_forwarded_for)
      del(.remote_addr)
      del(.request)
      del(.path)

  nginx_otela_geoip:
    type: remap
    inputs:
      - nginx_otela_parsed
    source: |
      .latitude = ""
      .longitude = ""
      geo, geo_err = get_enrichment_table_record("otela_geoip", { "ip": .ip })
      if geo_err == null {
        if geo != null {
          .latitude = to_string(geo.latitude) ?? ""
          .longitude = to_string(geo.longitude) ?? ""
        }      
      }

  nginx_otela_calls_total:
    type: log_to_metric
    inputs:
      - nginx_otela_geoip
    metrics:
      - type: counter
        name: otela_calls_total
        field: metric_increment
        increment_by_value: true
        tags:
          job: "{{ job }}"
          latitude: "{{ latitude }}"
          longitude: "{{ longitude }}"
          navigator: "{{ navigator }}"
          os: "{{ os }}"
          platform: "{{ platform }}"
          referrer: "{{ referer }}"
          service_name: "{{ service.name }}"
          span_name: "{{ span.name }}"
          title: "{{ span.title }}"

sinks:
  loki:
    type: loki
    inputs:
      - docker_logs_processed
    endpoint: http://loki:3100
    encoding:
      codec: json
    labels:
      application: "{{ service.name }}"
      container_*: "{{ container }}"
      level: "{{ level }}"

  prometheus:
    type: prometheus_exporter
    inputs:
      - host_metrics
#      - baywatch_prometheus
      - nginx_otela_calls_total
    address: 0.0.0.0:9091
