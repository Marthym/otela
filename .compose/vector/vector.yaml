data_dir: /var/lib/vector

enrichment_tables:
  otela_geoip:
    type: geoip
    path: /var/lib/geoip/GeoLite2-City.mmdb

sources:
  host_metrics:
    type: host_metrics
    scrape_interval_secs: 30

#  baywatch_prometheus:
#    type: prometheus_scrape
#    endpoints:
#      - http://baywatch:8081/actuator/prometheus
#    scrape_interval_secs: 5
#    auth:
#      strategy: basic
#      user: "{{ _otel_baywatch_user }}"
#      password: "{{ _otel_baywatch_password }}"

  docker_logs:
    type: docker_logs
    include_containers:
      - otela-nginx

transforms:

  docker_logs_processed:
    type: remap
    inputs:
      - docker_logs
    source: |
      .container_image = del(.image)
      .application = string(.label.application) ?? ""

      if .application == "Baywatch" {
        app, app_err = parse_json(.message)
        if app_err == null {
          .timestamp = app.timestamp
          .level = downcase(string(app.level) ?? "")
          .message = string(app.message) ?? .message
        }
      } else if .application == "imgproxy" {
        app, app_err = parse_json(.message)
        if app_err == null {
          .timestamp = app.time
          .level = downcase(string(app.level) ?? "")
          if app.error != null {
            .message = string(app.error) ?? .message
          } else if app.msg != null {
            .message = string(app.msg) ?? .message
          }
          if app.request_id != null {
            .thread = app.request_id
          }
        }
      }

      del(.attrs)
      del(.stream)
      del(.time)
      del(.label)

  nginx_otela_lines:
    type: filter
    inputs:
      - docker_logs_processed
    condition: contains(string!(.message), " /v1/traces")

  nginx_otela_parsed:
    type: remap
    inputs:
      - nginx_otela_lines
    source: |
      parsed, err = parse_nginx_log(.message, "main")
      if err != null {
        abort
      }
      . = parsed
      
      req = string(.request) ?? ""
      req_parts = split(req, " ")
      if length(req_parts) < 2 {
        abort
      }
      
      .path = string!(req_parts[1])
      if !starts_with(.path, "/v1/traces") {
        abort
      }

      path_parts = split_path(.path)
      if length(path_parts) < 2 {
        abort
      }
      payload_url = path_parts[3]
      payload_json_raw, payload_err = decode_base64(payload_url)
      if payload_err != null {
        abort
      }

      payload_json, parse_payload_err = parse_json(string(payload_json_raw))
      if parse_payload_err != null {
        abort
      }

      .job = "otela"
      .ip = string(.http_x_forwarded_for) ?? string(.remote_addr) ?? "127.0.0.1"
      ua_raw = string(.http_user_agent) ?? ""
      .navigator = ""
      .os = ""
      .platform = "desktop"

      ua = parse_user_agent(ua_raw)
      .navigator = string(ua.browser.family) ?? ""
      .os = string(ua.os.family) ?? ""
      ua_device = downcase(string(ua.device.category) ?? "")
      if ua_device == "mobile" || ua_device == "tablet" || ua_device == "wearable" || ua_device == "smarttv" {
        .platform = "mobile"
      } else if ua_device == "pc" || ua_device == "desktop" {
        .platform = "desktop"
      }

      if .navigator == "" {
        .navigator = ua_raw
      }

      .service_name = ""
      http_referer = string!(.http_referer)
      if http_referer != "-" && http_referer != "" {
        parsed_service, parsed_service_err = parse_url(http_referer)
        if parsed_service_err == null && parsed_service.host != null {
          .service_name = string(parsed_service.host) ?? ""
        }
      }
      if .service_name == "" && .referer != "direct" {
        .service_name = .referer
      }
      if .service_name == "" {
        abort
      }
      
      .referer = string(payload_json.referer) ?? "direct"
      if .referer == "" {
        .referer = "direct"
      }
      if starts_with(.referer, "http://") || starts_with(.referer, "https://") {
        parsed_referer, parsed_referer_err = parse_url(.referer)
        if parsed_referer_err == null && parsed_referer.host != null {
          .referer = string(parsed_referer.host) ?? .referer
        }
      }

      .title = string(payload_json.title) ?? "-"
      .metric_increment = 1
      del(.body_bytes_size)
      del(.http_referer)
      del(.http_user_agent)
      del(.http_x_forwarded_for)
      del(.remote_addr)
      del(.request)
      del(.path)

  nginx_otela_geoip:
    type: remap
    inputs:
      - nginx_otela_parsed
    source: |
      geo = get_enrichment_table_record!("otela_geoip", { "ip": .ip })
      if geo != null {
        .latitude = to_string(geo.latitude) ?? ""
        .longitude = to_string(geo.longitude) ?? ""
      } else {
        .latitude = ""
        .longitude = ""
      }

  nginx_otela_calls_total:
    type: log_to_metric
    inputs:
      - nginx_otela_geoip
    metrics:
      - type: counter
        name: otela_calls_total
        field: metric_increment
        increment_by_value: true
        tags:
          ip: "{{ ip }}"
          job: "{{ job }}"
          latitude: "{{ latitude }}"
          longitude: "{{ longitude }}"
          navigator: "{{ navigator }}"
          os: "{{ os }}"
          platform: "{{ platform }}"
          referrer: "{{ referer }}"
          service_name: "{{ service_name }}"
          title: "{{ title }}"

sinks:
  loki:
    type: loki
    inputs:
      - docker_logs_processed
    endpoint: http://loki:3100
    encoding:
      codec: json
    labels:
      application: "{{ application }}"
      container_id: "{{ container_id }}"
      container_name: "{{ container_name }}"
      container_image: "{{ container_image }}"

  prometheus:
    type: prometheus_exporter
    inputs:
      - host_metrics
#      - baywatch_prometheus
      - nginx_otela_calls_total
    address: 0.0.0.0:9091
